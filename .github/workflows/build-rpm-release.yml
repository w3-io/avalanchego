name: build-rpm-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build RPMs for'
        required: true
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/packaging/**"
      - ".github/workflows/build-rpm-release.yml"
      - ".github/workflows/upload-pkg-s3.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-rpm:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.setup.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # When building an older tag via workflow_dispatch, the tag's
      # .github/packaging tree may be stale or absent. Replace it
      # wholesale with the workflow branch's version so that the build
      # uses the current packaging:test-build-rpms task and scripts.
      # Split into two steps because actions/checkout (which provides
      # the master-side tree) and the cp (which applies it) cannot be
      # combined.
      - name: Overlay packaging scripts from workflow branch
        if: github.event.inputs.tag
        uses: actions/checkout@v5
        with:
          path: .packaging-overlay
          sparse-checkout: .github/packaging

      - name: Apply packaging overlay
        if: github.event.inputs.tag
        run: |
          rm -rf .github/packaging
          mv .packaging-overlay/.github/packaging .github/packaging
          rm -rf .packaging-overlay
        shell: bash

      - uses: ./.github/actions/setup-go-for-project

      - name: Set up packaging environment
        id: setup
        run: ./.github/packaging/scripts/workflow-setup-packaging.sh
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          GPG_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.RPM_GPG_PRIVATE_KEY || '' }}
          RELEASE: ${{ github.event_name != 'pull_request' && 'true' || '' }}

      - name: Build and validate RPMs
        run: ./scripts/run_task.sh --taskfile .github/packaging/Taskfile.yml test-build-rpms
        env:
          PACKAGING_TAG: ${{ steps.setup.outputs.tag }}
          GPG_KEY_FILE: ${{ steps.setup.outputs.gpg-key-file }}
          GPG_KEY_PASSPHRASE: ${{ github.event_name != 'pull_request' && secrets.RPM_GPG_PASSPHRASE || '' }}

      - name: Upload RPMs as artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: rpms-${{ matrix.rpm_arch }}
          path: |
            build/rpm/avalanchego-${{ steps.setup.outputs.tag }}-${{ matrix.rpm_arch }}.rpm
            build/rpm/subnet-evm-${{ steps.setup.outputs.tag }}-${{ matrix.rpm_arch }}.rpm
            build/rpm/RPM-GPG-KEY-avalanchego

      - name: Cleanup
        if: always()
        run: |
          if [[ -n "${{ steps.setup.outputs.gpg-key-file }}" ]]; then
            rm -f "${{ steps.setup.outputs.gpg-key-file }}"
          fi
          rm -rf build/rpm
          sudo rm -rf build/gpg
        shell: bash

  # Release-only S3 upload. Delegates to the shared upload-pkg-s3
  # workflow so id-token: write stays scoped to that workflow's job —
  # never granted to a job that checks out a tag tree and runs
  # packaging scripts.
  upload-rpms-s3:
    needs: build-rpm
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/upload-pkg-s3.yml
    with:
      pkg-format: rpm
      tag: ${{ needs.build-rpm.outputs.tag }}
      arches: '["x86_64","aarch64"]'
      packages: 'avalanchego subnet-evm'
      distros: 'el9'
      s3-prefix: linux/rpms/rhel
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_SA_ROLE_ARN }}
      BUCKET: ${{ secrets.BUCKET }}
